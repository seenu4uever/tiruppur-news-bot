name: TEMP - Get Chat ID

on:
  workflow_dispatch:

jobs:
  get-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Query bot updates (chat IDs only, token never printed)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 -c "
          import os, requests
          token = os.environ['TELEGRAM_BOT_TOKEN']
          resp = requests.get(f'https://api.telegram.org/bot{token}/getUpdates', timeout=15)
          data = resp.json()
          for u in data.get('result', []):
              msg = u.get('message') or u.get('channel_post') or {}
              chat = msg.get('chat', {})
              if chat:
                  print(f\"chat_id={chat.get('id')} type={chat.get('type')} title_or_name={chat.get('title') or chat.get('first_name')} text={msg.get('text')}\")
          "
